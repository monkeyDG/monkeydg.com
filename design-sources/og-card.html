<!doctype html>
<!-- Source for assets/img/og-card.png (1200x630). Re-render with a headless browser screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  .og { position: relative; height: 100%; padding: 72px 80px; display: grid; align-content: space-between; isolation: isolate; }
  .og::before { content: ""; position: absolute; inset: 0; z-index: -1; background-image: radial-gradient(var(--grid-dot) 1.2px, transparent 1.4px); background-size: 24px 24px; -webkit-mask-image: radial-gradient(ellipse 80% 90% at 80% 20%, #000 20%, transparent 75%); }
  .og h1 { font-family: var(--font-serif); font-weight: 400; font-size: 104px; line-height: 0.95; letter-spacing: -0.025em; }
  .og h1 em { color: var(--accent); }
  .og .top { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 26px; }
  .og .top img { width: 48px; height: 48px; border-radius: 50%; }
  .og .bottom { display: flex; justify-content: space-between; align-items: flex-end; }
  .og .og-role { font-size: 30px; color: var(--ink-2); white-space: nowrap; }
  .og .og-role b { display: inline; }
  .og .og-role b { color: #0052ff; font-weight: 700; }
  .og .url { font-family: var(--font-mono); font-size: 22px; color: var(--ink-3); }
</style>
</head>
<body>
  <div class="og">
    <div class="top"><img src="../assets/img/brand/monkey-180.png" alt=""> David Gallo</div>
    <h1>Helping teams ship fast,<br>and <em>know</em> it worked.</h1>
    <div class="bottom">
      <p class="og-role">Data Scientist · <b>Coinbase</b> International</p>
      <p class="url">monkeydg.com</p>
    </div>
  </div>
</body>
</html>
